name: Wallpaper market offline dry-run

# Draft: no schedule, live API writes, auto-merge, signing secret or Release publication.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: market-offline-dry-run
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install selected test dependencies
        run: python3 -m pip install --requirement market/requirements.txt
      - name: Test metadata and security boundaries
        run: python3 -m unittest discover -s tests/market
      - name: Replay synthetic responses only
        run: python3 -m tools.market dry-run --now 2026-10-26T00:00:00Z --output Validation/Market/dry-run.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: market-offline-dry-run
          path: Validation/Market/dry-run.json
          retention-days: 7
          if-no-files-found: error
