name: Wallpaper market submission check

# Only reviewed base tools execute; contributor files arrive as bounded API JSON.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'market/registry/**'
      - 'market/submissions/**'

permissions: {}

jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Install trusted metadata tool dependencies
        run: python -m pip install --requirement market/requirements.txt
      - name: Fetch pinned platform validator
        env:
          MARKET_REPOSITORY: KyaKayKya/Spatial-Wallpaper-Community
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATOR_ZIP_SHA256: ${{ vars.MARKET_VALIDATOR_SHA256 }}
        run: python -m tools.market.publish prepare-validator --sha256 "$env:VALIDATOR_ZIP_SHA256" --output Validation/Market/validator
      - name: Check exact API submission and native package bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -m tools.market.publish check-pr --number "$env:PR_NUMBER" --head "$env:PR_HEAD" --validator-config Validation/Market/validator/validator-config.json --output Validation/Market/submission-check.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: market-submission-check
          path: Validation/Market/submission-check.json
          if-no-files-found: error
          retention-days: 7
